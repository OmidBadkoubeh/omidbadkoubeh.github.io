experience:
  - role: Senior Frontend Engineer, Frontend Team Lead
    company: Corvic / Codaze
    period: 04/2024 – 05/2026
    location: Remote
    stack: [Next.js, tRPC, Three.js, WebGL, Monorepo, Jest]
    highlights:
      - Led the frontend team building a data-heavy enterprise AI dashboard with Next.js and tRPC, serving AI teams at Fortune 500 enterprises, while improving data-fetching efficiency and state management across complex workflows.
      - Built a custom Three.js/WebGL scatterplot rendering 10M nodes at 60fps and 1M nodes at a smooth 120fps, optimizing memory allocation and frame rates for seamless 2D/3D exploration.
      - Drove migration to a monorepo, extracting shared UI and business logic into reusable packages consumed by both the dashboard and an embeddable agent-chat widget (custom JS install for third-party websites), accelerating feature development by 2x+ and simplifying cross-app UI maintenance.
      - Safeguarded critical logic with Jest unit tests, improving reliability across frequent releases.

  - role: Senior Frontend Engineer
    company: Embark
    period: 04/2022 – 01/2024
    location: Remote
    stack: [Next.js, Wagmi, Viem, WalletConnect, TailwindCSS]
    highlights:
      - Owned all frontend architecture decisions for a decentralized Web3 dashboard built with Next.js and Wagmi/Viem, supporting connection of virtually any Ethereum-compatible wallet and integrating WalletConnect for a polished connection UX with real-time blockchain event listening and smooth transaction states.
      - Structured the UI as a reusable component system using atomic design, improving consistency and development speed across the product.
      - Built a responsive, SEO-optimized landing page from scratch with Next.js and TailwindCSS, achieving 95+ scores across all Core Web Vitals.
      - Covered critical application flows with Jest unit tests to ensure stability during rapid iteration.

  - role: Senior Developer & Technical Team Lead
    company: Youtopin
    period: 07/2021 – 05/2022
    stack: [React Native Web, Fastlane, Docker, CI/CD, Cypress]
    highlights:
      - Built a CI/CD deployment pipeline from the ground up using Fastlane, auto-triggering on PR merges and cutting deploy time from ~1 hour to 20 minutes.
      - Led development of iOS and Progressive Web App (PWA) projects from a single codebase using React Native Web, sharing business logic and a UI component library organized with atomic design to reduce overhead.
      - Validated critical user journeys across the React Native apps with Cypress end-to-end tests.
      - Containerized the PWA project with Docker to streamline local development and deployment workflows.
      - Mentored junior engineers, conducted code reviews, and aligned front-end technical strategy with product goals.

  - role: React & React Native Developer
    company: Bakoot
    period: 05/2019 – 05/2021
    stack: [React Native, React, Next.js, Leaflet, OpenStreetMap]
    highlights:
      - "Delivered a food-delivery ecosystem serving ~10K monthly users and ~100 orders/day: the consumer-facing Pizza.ir app (React Native), a courier Android app (React Native), and the company blog (React)."
      - Built an admin geo-fencing feature letting operators define supported delivery regions by drawing polygons on interactive maps with Leaflet and OpenStreetMap.
      - Developed the courier app for viewing assigned orders and destinations, accepting deliveries, and navigating via in-app directions or handoff to Waze/Google Maps.
      - Built the Bakoot corporate website and SydneyGentleCare.com.au with Next.js and TailwindCSS for high performance and SEO.

